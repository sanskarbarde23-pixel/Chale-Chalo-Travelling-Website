<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-wrap">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 col-xl-8">
                    <div class="card auth-card">
                        <div class="row g-0">
                            <!-- Branding side -->
                            <div class="col-md-5 auth-side">
                                <a href="index.html"
                                    class="text-white text-decoration-none fw-bold fs-4 mb-4 d-inline-block">
                                    <i class="fa-solid fa-plane-departure"></i> ChaloChale
                                </a>
                                <h3 class="mb-3">Start Your Adventure</h3>
                                <p class="quote mb-4">"Join 50,000+ explorers. Your first trip is on us — literally,
                                    with ₹500 credit."</p>
                                <ul class="list-unstyled small opacity-75">
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>₹500
                                        welcome travel credit</li>
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>Early
                                        access to deals</li>
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>Free
                                        itinerary planner</li>
                                </ul>
                            </div>

                            <!-- Form side -->
                            <div class="col-md-7 p-4 p-md-5">
                                <h4 class="fw-bold mb-1">Create Account</h4>
                                <p class="text-muted mb-4">Already a member? <a href="login.html"
                                        class="fw-semibold text-decoration-none" style="color:var(--cc-primary)">Sign
                                        in</a></p>

                                <form id="authForm" novalidate>
                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input id="signupName" type="text" class="form-control"
                                            placeholder="Your full name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email Address</label>
                                        <input type="email" class="form-control" placeholder="you@example.com" required>
                                    </div>
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Phone</label>
                                            <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">City</label>
                                            <input type="text" class="form-control" placeholder="Your city">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <div class="pw-wrap">
                                            <input id="signupPass" type="password" class="form-control"
                                                placeholder="Min. 6 characters" required>
                                            <button type="button" class="pw-toggle" data-target="signupPass"><i
                                                    class="fa-solid fa-eye"></i></button>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Confirm Password</label>
                                        <div class="pw-wrap">
                                            <input id="confirmPass" type="password" class="form-control"
                                                placeholder="Repeat password" required>
                                            <button type="button" class="pw-toggle" data-target="confirmPass"><i
                                                    class="fa-solid fa-eye"></i></button>
                                        </div>
                                    </div>
                                    <div class="form-check mb-4">
                                        <input class="form-check-input" type="checkbox" id="termsSignup" required>
                                        <label class="form-check-label small" for="termsSignup">
                                            I agree to the <a href="#" class="text-decoration-none fw-semibold">Terms of
                                                Service</a> and <a href="#"
                                                class="text-decoration-none fw-semibold">Privacy Policy</a>.
                                        </label>
                                    </div>
                                    <button type="submit" class="btn-cc w-100 justify-content-center py-3">
                                        <i class="fa-solid fa-user-plus"></i> Create Account
                                    </button>
                                </form>

                                <div class="text-center mt-4">
                                    <a href="index.html" class="small text-muted text-decoration-none"><i
                                            class="fa-solid fa-arrow-left me-1"></i>Back to home</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="backToTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
