<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ChaloChale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrap">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 col-xl-8">
                    <div class="card auth-card">
                        <div class="row g-0">
                            <!-- Branding side -->
                            <div class="col-md-5 auth-side">
                                <a href="index.html" class="text-white text-decoration-none fw-bold fs-4 mb-4 d-inline-block">
                                    <i class="fa-solid fa-plane-departure"></i> ChaloChale
                                </a>
                                <h3 class="mb-3">Welcome Back, Explorer!</h3>
                                <p class="quote mb-4">"The journey of a thousand miles begins with a single login."</p>
                                <ul class="list-unstyled small opacity-75">
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>Manage your bookings anytime</li>
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>Earn rewards on every trip</li>
                                    <li class="mb-2"><i class="fa-solid fa-circle-check me-2 text-warning"></i>Exclusive member-only deals</li>
                                </ul>
                            </div>

                            <!-- Form side -->
                            <div class="col-md-7 p-4 p-md-5">
                                <h4 class="fw-bold mb-1">Sign In</h4>
                                <p class="text-muted mb-4">New to ChaloChale? <a href="signup.html" class="fw-semibold text-decoration-none" style="color:var(--cc-primary)">Create an account</a></p>

                                <form id="authForm" novalidate>
                                    <div class="mb-3">
                                        <label class="form-label">Email Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                            <input type="email" class="form-control border-start-0" placeholder="you@example.com" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <div class="pw-wrap">
                                            <input id="loginPass" type="password" class="form-control" placeholder="••••••••" required>
                                            <button type="button" class="pw-toggle" data-target="loginPass"><i class="fa-solid fa-eye"></i></button>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe">
                                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                                        </div>
                                        <a href="#" class="small text-decoration-none fw-semibold" style="color:var(--cc-primary)">Forgot password?</a>
                                    </div>
                                    <button type="submit" class="btn-cc w-100 justify-content-center py-3">
                                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                                    </button>
                                </form>

                                <div class="text-center mt-4">
                                    <span class="text-muted small">or continue with</span>
                                    <div class="d-flex justify-content-center gap-3 mt-3">
                                        <a href="#" class="social-btn" style="background:var(--cc-dark);color:#fff;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;"><i class="fa-brands fa-google"></i></a>
                                        <a href="#" class="social-btn" style="background:var(--cc-dark);color:#fff;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;"><i class="fa-brands fa-facebook-f"></i></a>
                                        <a href="#" class="social-btn" style="background:var(--cc-dark);color:#fff;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;"><i class="fa-brands fa-apple"></i></a>
                                    </div>
                                </div>

                                <div class="text-center mt-4">
                                    <a href="index.html" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to home</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="backToTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
